[project]
name = "system-agent-backend"
version = "9.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.1",
  "sqlalchemy[asyncio]>=2.0.31",
  "asyncpg>=0.29.0",
  "alembic>=1.13.1",
  "redis[hiredis]>=5.0.7",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "pwdlib[argon2]>=0.3.0",
  "email-validator>=2.2.0",
  "pillow>=11.0.0",
  "python-multipart>=0.0.9",
  "httpx[socks]>=0.27.0",
  "apscheduler>=3.10.4,<4",
  "slowapi>=0.1.9",
  "python-dotenv>=1.0.1",
  "litellm>=1.30.0",
  "pgvector>=0.2.0",
  "tiktoken>=0.5.0",
  "tenacity>=8.2.0",
  "openai>=1.12.0",
  "opentelemetry-api>=1.30.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=6.0",
  "ruff>=0.11.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
